<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#120d18" />
  <meta name="description" content="Le Sceau des Quatre Veilleurs — aventure géolocalisée et immersive à Bissey-la-Côte et Layer-sur-Roche." />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <title>Le Sceau des Quatre Veilleurs</title>
</head>
<body>
  <div id="sky" aria-hidden="true">
    <div class="moon"></div>
    <div class="stars"></div>
  </div>
  <div id="fog" aria-hidden="true"></div>
  <div id="ambientRunes" aria-hidden="true"></div>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <button id="soundButton" class="sound-button" type="button" aria-label="Activer ou désactiver l’ambiance sonore">🔊</button>
  <button id="gmButton" class="gm-button" type="button" aria-label="Mode maître du jeu">⚙</button>
  <script src="app.js" defer></script>
</body>
</html>
